mealie:
  base_url: https://mealie.local
  token:
  verify_ssl: false
  ca_bundle: null
processing:
  output_folder: data/pipeline
  language: de
ingredients:
  fuzzy_threshold: 90
  cache_dir: data/cache
  default_category: Sonstiges
  default_category_color: '#959595'
  use_llm_classifier: true
  use_llm_forms: true
  use_embeddings: true
llm:
  provider: anthropic
  api_key:
  base_url:
  timeout: 240
  model: claude-sonnet-4-6
  vision_model: claude-sonnet-4-6
  temperature: null
  max_tokens: null
  models:
    - id: claude-sonnet-4-6
      supportsSampling: true
    - id: claude-haiku-4-5
      supportsSampling: true

mealie:
  base_url: https://mealie.local
  token: 
  verify_ssl: false
  ca_bundle: null
processing:
  output_folder: data/pipeline
  language: de
ingredients:
  fuzzy_threshold: 90
  cache_dir: data/cache
  default_category: Sonstiges
  default_category_color: '#959595'
  use_llm_classifier: true
  use_llm_forms: true
llm:
  provider: openai
  api_key: 
  base_url: https://api.openai.com/v1
  timeout: 240
  model: gpt-5-mini
  vision_model: gpt-5-mini
  temperature: null
  max_tokens: null
  models:
    - id: gpt-5-mini
      supportsSampling: false
    - id: gpt-5-nano
      supportsSampling: false
    - id: gpt-4.1-mini
      supportsSampling: true
    - id: gpt-4.1-nano
      supportsSampling: true
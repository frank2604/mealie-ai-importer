# Configuration for the Mealie Importer. Keep secrets in the .env file only.
mealie:
  # Base URL of your Mealie instance, including protocol and port.
  base_url: "https://mealie.local"
  # Token is read from the MEALIE_TOKEN environment variable; leave empty here.
  token: ""
  # Set to false to skip TLS certificate verification (e.g. self-signed certs).
  verify_ssl: false
  # Optional path to a custom CA bundle for TLS verification.
  ca_bundle:

processing:
  # Folder that is watched for new PDF input files.
  watch_folder: "PDFs"
  # Working directory for pipeline Artefakte (z. B. nummerierte JSONs, Payloads).
  output_folder: "data/pipeline"
  # Enable to run OCR on scanned documents before parsing.
  ocr_enabled: false
  # ISO language code used for OCR and language-specific processing.
  language: "de"
  # Skip the AI analysis when a cached RecipeRawData.json already exists.
  skip_ai_if_cached: true

ingredients:
  # Similarity threshold (0-100) for fuzzy ingredient matching.
  fuzzy_threshold: 90
  # Directory where ingredient lookup data is cached.
  cache_dir: "data/cache"
  # Default category assigned to unmatched ingredients.
  default_category: "Sonstiges"
  # Hex color used for the default ingredient category in Mealie.
  default_category_color: "#959595"
  # When true, ask the LLM to classify ingredients that are unclear.
  use_llm_classifier: true
  # When true, use the LLM to infer singular/plural forms and aliases for missing foods.
  use_llm_forms: true

llm:
  # Provider identifier used to select the language model backend.
  provider: "openai"
  # Default language model for text-based recipe parsing.
  model: "gpt-5-mini"
  # Sampling temperature controlling creativity (empty means provider default).
  temperature:
  # Maximum number of tokens generated by the model (empty means provider default).
  max_tokens:
  # API key is read from the LLM_API_KEY environment variable; leave empty here.
  api_key: ""
  # Base URL for the LLM API endpoint.
  base_url: "https://api.openai.com/v1"
  # Vision-capable model used when parsing images from recipes.
  vision_model: "gpt-5-mini"
  # Request timeout (in seconds) for calls to the LLM API.
  timeout: 240
